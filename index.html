<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Q'Detalles Virú · Catálogo de ramos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
:root{
  --bg:#fbf6f2;--surface:#ffffff;--ink:#2a1a1f;--muted:#7a6a6e;--accent:#9b2447;--accent-ink:#ffffff;
  --soft:#f6e6e9;--line:#eadfe0;--wa:#1c9d55;--shadow:0 6px 24px rgba(90,30,50,.10);
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#1a1216;--surface:#251a1f;--ink:#f6ecee;--muted:#b7a3a9;--accent:#e37a97;--accent-ink:#2a0d17;--soft:#33222a;--line:#3a2a31;--wa:#2bbd6a;--shadow:0 6px 24px rgba(0,0,0,.4)}
}
:root[data-theme="dark"]{--bg:#1a1216;--surface:#251a1f;--ink:#f6ecee;--muted:#b7a3a9;--accent:#e37a97;--accent-ink:#2a0d17;--soft:#33222a;--line:#3a2a31;--wa:#2bbd6a;--shadow:0 6px 24px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:1080px;margin:0 auto;padding:0 16px 120px}

/* Encabezado */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:0 -16px;padding:12px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{width:100%;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.logo svg{width:24px;height:24px}
.bn{font:700 22px/1.1 var(--serif);letter-spacing:.2px}
.bt{font-size:12px;color:var(--muted)}
.hero{padding:34px 0 22px;text-align:center;max-width:640px;margin:0 auto}
.eyebrow{margin:0 0 6px;text-transform:uppercase;letter-spacing:.22em;font-size:11px;color:var(--accent);font-weight:600}
.hero h1{margin:0 0 10px;font:700 clamp(30px,7vw,46px)/1.05 var(--serif)}
.hero p{margin:0;color:var(--muted)}
.hero .note{display:inline-block;margin-top:14px;padding:7px 14px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:13px;font-weight:500}

/* Grilla */
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
.grid>.card{width:calc((100% - 14px)/2)}
.grid>.empty{width:100%}
@media(min-width:720px){.grid{gap:22px}.grid>.card{width:calc((100% - 44px)/3)}}
@media(min-width:1000px){.grid>.card{width:calc((100% - 66px)/4)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);position:relative}
.ph{display:block;width:100%;aspect-ratio:4/5;border:0;padding:0;background:var(--soft);position:relative;overflow:hidden}
.ph img,.ph svg{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.card:hover .ph img,.card:hover .ph svg{transform:scale(1.04)}
.tag{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.72);color:#fff;font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;letter-spacing:.04em}
.card.sold .ph{filter:grayscale(.7);opacity:.75}
.info{padding:12px 12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.info h3{margin:0;font:700 20px/1.15 var(--serif)}
.info .d{margin:0;color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row{margin-top:auto;padding-top:6px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.price{font:700 22px/1 var(--serif);color:var(--accent)}
.soldtxt{font-size:12px;color:var(--muted)}
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:600;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.add{background:var(--accent);color:var(--accent-ink);padding:8px 16px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.wa{background:var(--wa);color:#fff;width:100%;padding:14px 18px;font-size:16px}
.btn[disabled]{opacity:.45;pointer-events:none}
.step{display:inline-flex;align-items:center;background:var(--soft);border-radius:999px}
.step button{width:34px;height:34px;border:0;background:transparent;font-size:20px;color:var(--accent);border-radius:50%}
.step span{min-width:22px;text-align:center;font-weight:600}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)}
footer{margin-top:44px;padding-top:20px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:12px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:12px;padding:6px}

/* Barra del carrito */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 12px);pointer-events:none;display:flex;justify-content:center}
.cartbar{pointer-events:auto;width:100%;max-width:520px;border:0;background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 10px 30px rgba(0,0,0,.28);font-weight:600;animation:up .25s ease}
.cartbar .n{background:var(--accent-ink);color:var(--accent);border-radius:999px;min-width:26px;height:26px;display:inline-grid;place-items:center;font-size:13px;margin-right:10px;padding:0 6px}
@keyframes up{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}

/* Modales */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(20,8,12,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 20px);animation:up .25s ease;position:relative}
@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:24px}}
.sheet h2{margin:0 0 14px;font:700 28px/1.1 var(--serif)}
.x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);font-size:18px;z-index:2}
.big{width:calc(100% + 36px);margin:-20px -18px 14px;aspect-ratio:1/1;background:var(--soft);overflow:hidden}
.big img,.big svg{width:100%;height:100%;object-fit:cover;display:block}
.det .price{font-size:28px}
.det p{color:var(--muted);white-space:pre-line}
.line{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line .th{width:54px;height:66px;border-radius:10px;overflow:hidden;background:var(--soft);flex:none}
.line .th img,.line .th svg{width:100%;height:100%;object-fit:cover;display:block}
.line .nm{flex:1;min-width:0}
.line .nm b{display:block;font:700 18px/1.1 var(--serif)}
.line .nm small{color:var(--muted)}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 4px}
.tot b{font:700 30px/1 var(--serif);color:var(--accent)}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 4px;letter-spacing:.02em}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=tel],input[type=number],textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;outline:none;font-size:16px}
input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px;font-weight:600;font-size:14px}
.seg button.on{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.hint{font-size:12px;color:var(--muted);margin:8px 0 0}
.btns{display:flex;gap:10px;margin-top:18px}.btns .btn{flex:1}
.sec{font:600 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:18px 0 0}

/* Admin */
.abar{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;margin:0 -16px;padding:10px 16px;background:#2a1a1f;color:#fff;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13px}
.abar+.hdr{top:calc(env(safe-area-inset-top,0px) + 54px)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts button{border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}
.acts .pub{background:#f4b73f;border-color:#f4b73f;color:#2a1a1f}
.acts .pub[disabled]{opacity:.4;pointer-events:none}
.acard{display:flex;gap:6px;padding:8px;background:var(--soft);border-top:1px solid var(--line)}
.acard button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px;font-size:12px;font-weight:600}
.acard .dl{color:#b3261e}
.ov{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.fbtn{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;padding:11px;border:1px solid var(--line);border-radius:12px;font-weight:600;font-size:14px;color:var(--ink);overflow:hidden;background:var(--bg)}
.hbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;margin-left:auto;flex:none}
.drop{position:relative;display:grid;place-items:center;text-align:center;aspect-ratio:4/3;border:2px dashed var(--line);border-radius:16px;background:var(--bg);color:var(--muted);overflow:hidden;cursor:pointer;font-size:14px;margin:0}
.drop img,.drop svg{width:100%;height:100%;object-fit:cover}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);font-weight:500}
.chk input{width:18px;height:18px}
.chips{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:15;margin:0 -16px 8px;padding:10px 16px;display:flex;gap:8px;overflow-x:auto;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);scrollbar-width:none}
.abar~.chips{top:calc(env(safe-area-inset-top,0px) + 120px)}
.chips::-webkit-scrollbar{display:none}
.chips:empty{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600;white-space:nowrap}
.chips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:8px 0 6px}
.tile{position:relative;width:calc((100% - 12px)/2);aspect-ratio:1/1;border:0;padding:0;border-radius:18px;overflow:hidden;background:var(--soft);box-shadow:var(--shadow);text-align:left}
@media(min-width:720px){.tile{width:calc((100% - 24px)/3);aspect-ratio:4/3}}
@media(min-width:1000px){.tile{width:calc((100% - 36px)/4)}}
.tph{position:absolute;inset:0}.tph img,.tph svg{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.tile:hover .tph img,.tile:hover .tph svg{transform:scale(1.05)}
.tt{position:absolute;left:0;right:0;bottom:0;padding:34px 12px 12px;background:linear-gradient(transparent,rgba(20,8,12,.86));color:#fff;display:flex;flex-direction:column;gap:2px}
.tt b{font:700 21px/1.1 var(--serif)}.tt small{font-size:12px;opacity:.88}
.back{border:0;background:none;color:var(--accent);font-weight:600;font-size:14px;padding:8px 0;margin:2px 0 6px;display:block}
.sect{margin-top:26px}.sect:first-child{margin-top:10px}
.sh{margin:0 0 14px;font:700 clamp(24px,5vw,32px)/1.1 var(--serif);text-align:center}
.sh small{font:500 13px var(--sans);color:var(--muted);margin-left:8px}
select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:16px;outline:none}
.secrow{display:flex;gap:6px;align-items:center;margin-top:8px}.secrow input{flex:1;min-width:0}.secrow button{flex:none;width:38px;height:42px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px}
.chip{align-self:flex-start;display:inline-block;font-size:12px;font-weight:600;color:var(--accent);background:var(--soft);padding:3px 10px;border-radius:999px}
.pv{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-size:13px;margin-top:8px}.pv div{padding:4px 0;border-bottom:1px solid var(--line)}.pv div:last-child{border-bottom:0}
.err{color:#b3261e}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%);z-index:80;background:#2a1a1f;color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
</style>
</head>

function fileToDataUrl(file,max=900,q=.8){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=rej;
    fr.onload=()=>{const i=new Image();i.onerror=rej;i.onload=()=>{
      const s=Math.min(1,max/Math.max(i.width,i.height));
      const c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);
      c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q));};i.src=fr.result;};
    fr.readAsDataURL(file);
  });
}

/* ---------- Carga masiva ---------- */
let bulk={text:'',photos:{},order:[],items:[]};
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const baseName=f=>norm(f).replace(/\.[a-z0-9]+$/,'');
const COLS={name:['nombre','name','ramo','producto'],price:['precio','price','costo'],roses:['rosas','cantidad_rosas','cantidad de rosas','cant rosas','cantidad rosas','cantidad'],desc:['descripcion','description','detalle'],avail:['disponible','activo','estado','stock'],img:['foto','imagen','archivo','image','foto_archivo'],cat:['seccion','categoria','grupo','coleccion']};
function parseTable(txt){
  txt=String(txt||'').replace(/^\uFEFF/,'');
  const first=txt.split(/\r?\n/)[0]||'';
  const cnt=d=>first.split(d).length-1;
  const delim=cnt('\t')>0?'\t':(cnt(';')>0&&cnt(';')>=cnt(',')?';':',');
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;
    else if(c===delim){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(cur);cur='';rows.push(row);row=[]}
    else cur+=c;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
function mapRows(rows){
  if(!rows.length)return{items:[],errors:['Pega o sube tu tabla primero']};
  const head=rows[0].map(norm);const idx={};
  for(const k in COLS)idx[k]=head.findIndex(h=>COLS[k].includes(h));
  if(idx.name<0||idx.price<0)return{items:[],errors:['Faltan las columnas "nombre" y "precio" en la primera fila']};
  const items=[],errors=[];
  rows.slice(1).forEach((r,n)=>{
    const get=k=>idx[k]>=0?String(r[idx[k]]==null?'':r[idx[k]]).trim():'';
    const name=get('name');
    if(!name){errors.push('Fila '+(n+2)+': falta el nombre');return}
    const price=parseFloat(get('price').replace(/[^\d,.\-]/g,'').replace(/,(\d{1,2})$/,'.$1').replace(/,/g,''));
    if(isNaN(price)||price<0){errors.push('Fila '+(n+2)+' ('+name+'): precio no válido');return}
    const ro=parseInt(get('roses'),10);
    const av=norm(get('avail'));
    items.push({name:name,price:price,desc:get('desc'),roses:ro>0?ro:'',avail:!['no','0','agotado','false','inactivo'].includes(av),imgName:get('img'),cat:get('cat')});
  });
  return{items:items,errors:errors};
}
function pickPhoto(item,i,total){
  const ph=bulk.photos;
  if(item.imgName){const k=norm(item.imgName);if(ph[k])return ph[k];const b=baseName(item.imgName);const f=Object.keys(ph).find(x=>baseName(x)===b);if(f)return ph[f]}
  const nb=norm(item.name);const f2=Object.keys(ph).find(x=>baseName(x)===nb);if(f2)return ph[f2];
  if(!item.imgName&&total>0&&bulk.order.length===total)return ph[bulk.order[i]]||'';
  return '';
}
async function readText(file){const buf=await file.arrayBuffer();try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){return new TextDecoder('windows-1252').decode(buf)}}
async function bulkLoadPhotos(files){
  const list=[].slice.call(files).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
  for(let i=0;i<list.length;i++){
    toast('Procesando foto '+(i+1)+' de '+list.length+'…');
    try{const d=await fileToDataUrl(list[i]);const k=norm(list[i].name);if(!(k in bulk.photos))bulk.order.push(k);bulk.photos[k]=d}catch(e){}
  }
  const el=$('#bulkPh');if(el)el.textContent=bulk.order.length+' foto(s) cargada(s). Se asignan por el nombre de archivo de la columna "foto".';
  toast('Fotos listas ✓');
}
function bulkTemplate(){
  const rows=[['nombre','precio','cantidad_rosas','descripcion','disponible','foto','seccion'],['Ramo Girasoles','65','3','3 girasoles naturales con gypsophila','si','girasoles.jpg','Girasoles naturales'],['Ramo Romance','89','12','12 rosas eternas con lazo de satén','si','romance.jpg','Rosas eternas']];
  const csv='\uFEFF'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='plantilla-ramos.csv';
  document.body.appendChild(a);a.click();a.remove();
}
function bulkPreview(){
  const res=mapRows(parseTable(bulk.text));
  bulk.items=res.items;
  res.items.forEach((it,i)=>{it.img=pickPhoto(it,i,res.items.length)});
  const withImg=res.items.filter(i=>i.img).length;
  const upd=res.items.filter(it=>state.products.some(p=>norm(p.name)===norm(it.name))).length;
  let h='';
  if(res.items.length)h+='<p style="margin:12px 0 0"><b>'+res.items.length+'</b> ramos listos · '+withImg+' con foto'+(upd?' · '+upd+' actualizarán ramos que ya existen':'')+'</p><div class="pv">'+res.items.slice(0,12).map(i=>'<div>'+esc(i.name)+' — '+money(i.price)+(i.roses?' · 🌹 '+i.roses:'')+(i.img?' · 📷':'')+'</div>').join('')+(res.items.length>12?'<div>… y '+(res.items.length-12)+' más</div>':'')+'</div>';
  if(res.errors.length)h+='<p class="err" style="margin:10px 0 0;font-size:13px">'+res.errors.slice(0,5).map(esc).join('<br>')+(res.errors.length>5?'<br>… y '+(res.errors.length-5)+' avisos más':'')+'</p>';
  if(res.items.length)h+='<button class="btn primary" data-act="bulkgo" style="width:100%;margin-top:12px">Importar '+res.items.length+' ramos</button>';
  $('#bulkPrev').innerHTML=h;
}
function bulkGo(){
  const items=bulk.items||[];if(!items.length)return;
  const total=state.products.reduce((a,p)=>a+(p.img||'').length,0)+items.reduce((a,i)=>a+(i.img||'').length,0);
  if(total>10000000){toast('Son demasiadas fotos: el catálogo pasaría de 10 MB. Sube menos fotos por tanda');return}
  let added=0,updated=0;
  items.forEach(it=>{
    const i=state.products.findIndex(p=>norm(p.name)===norm(it.name));
    if(i>=0){const o=state.products[i];state.products[i]=Object.assign({},o,{price:it.price,desc:it.desc||o.desc,roses:it.roses||o.roses||'',avail:it.avail,img:it.img||o.img,cat:it.cat||o.cat||''});updated++}
    else{state.products.push({id:uid(),name:it.name,price:it.price,desc:it.desc,img:it.img||'',tone:Math.floor(Math.random()*3),roses:it.roses||'',avail:it.avail,cat:it.cat||''});added++}
  });
  bulk={text:'',photos:{},order:[],items:[]};
  markDirty();closeModal();renderApp();
  toast('Listo: '+added+' nuevos y '+updated+' actualizados. Toca Publicar cambios');
}
function openBulk(){
  openModal(`<h2>Carga masiva</h2>
   <p class="sec" style="margin-top:0">1. Plantilla</p>
   <button class="btn ghost" data-act="tpl" style="width:100%;margin-top:8px">⬇ Descargar plantilla (Excel / CSV)</button>
   <p class="hint">Columnas: nombre, precio, cantidad_rosas, descripcion, disponible (si/no), foto (nombre del archivo, por ejemplo romance.jpg) y seccion (por ejemplo Girasoles naturales).</p>
   <p class="sec">2. Tu tabla</p>
   <div class="fbtn">📄 Elegir archivo CSV<input class="ov bulkcsv" type="file" accept=".csv,.txt,text/csv"></div>
   <label>…o pega aquí desde Excel o Google Sheets</label>
   <textarea id="bulkText" data-b="text" rows="5" placeholder="nombre;precio;cantidad_rosas;descripcion;disponible;foto;seccion">${esc(bulk.text)}</textarea>
   <p class="sec">3. Fotos (opcional)</p>
   <div class="fbtn">🖼 Elegir fotos (varias a la vez)<input class="ov bulkph" type="file" accept="image/*" multiple></div>
   <p class="hint" id="bulkPh">${bulk.order.length} foto(s) cargada(s). Se asignan por el nombre de archivo de la columna "foto".</p>
   <div id="bulkPrev"></div>
   <div class="btns"><button class="btn ghost" data-act="close">Cancelar</button><button class="btn primary" data-act="bulkprev">Revisar</button></div>`);
  view={kind:'bulk',id:null};
}

/* ---------- Secciones ---------- */
let curSec='';
const EMPTY='<div class="empty"><h2 style="font:700 28px var(--serif);margin:0 0 6px">Muy pronto</h2>Estamos preparando nuestros nuevos ramos.</div>';
const secList=()=>{const l=(state.sections||[]).slice();state.products.forEach(p=>{if(p.cat&&l.indexOf(p.cat)<0)l.push(p.cat)});return l};
function groups(){
  const secs=secList();
  const g=secs.map(n=>({name:n,items:state.products.filter(p=>p.cat===n)}));
  const rest=state.products.filter(p=>!p.cat||secs.indexOf(p.cat)<0);
  if(rest.length)g.push({name:secs.length?'Otros ramos':'',items:rest});
  return g;
}
function chipsHtml(){
  const g=groups().filter(x=>x.name&&(x.items.length||admin));
  if(!g.length)return '';
  return '<button class="'+(curSec?'':'on')+'" data-act="sec" data-v="">Todos</button>'+g.map(x=>'<button class="'+(curSec===x.name?'on':'')+'" data-act="sec" data-v="'+esc(x.name)+'">'+esc(x.name)+'</button>').join('');
}
function mainHtml(){
  if(!state.products.length&&!secList().length)return EMPTY;
  const g=groups();
  if(!g.some(x=>x.name))return '<div class="grid">'+state.products.map(card).join('')+'</div>';
  let show=curSec?g.filter(x=>x.name===curSec):g;
  if(!show.length){curSec='';show=g}
  if(!admin)show=show.filter(x=>x.items.length);
  const named=g.filter(x=>x.name&&(x.items.length||admin));
  let pre='';
  if(!curSec&&named.length>=2)pre='<p class="eyebrow" style="text-align:center;margin:6px 0 0">Elige una categoría</p><div class="tiles">'+named.map(x=>{const cov=x.items.find(p=>p.img)||x.items[0];return '<button class="tile" data-act="sec" data-v="'+esc(x.name)+'"><span class="tph">'+(cov?imgOf(cov):roseArt(0))+'</span><span class="tt"><b>'+esc(x.name)+'</b><small>'+x.items.length+(x.items.length===1?' ramo':' ramos')+'</small></span></button>'}).join('')+'</div>';
  if(curSec)pre='<button class="back" data-act="sec" data-v="">← Ver todas las categorías</button>';
  return pre+show.map(x=>'<section class="sect">'+(x.name?'<h2 class="sh">'+esc(x.name)+'<small>'+x.items.length+'</small></h2>':'')+(x.items.length?'<div class="grid">'+x.items.map(card).join('')+'</div>':'<p class="hint" style="text-align:center">Sin ramos todavía en esta sección.</p>')+'</section>').join('');
}
function renderMain(){const c=$('#chips'),m=$('#main');if(c)c.innerHTML=chipsHtml();if(m)m.innerHTML=mainHtml()}
function openSections(){
  state.sections=secList();
  const l=state.sections;
  openModal(`<h2>Secciones</h2>
   <p class="hint" style="margin:0 0 6px">Agrupa tus ramos, por ejemplo "Girasoles naturales" o "Rosas eternas". Cambia el orden con las flechas.</p>
   ${l.map((s,i)=>`<div class="secrow"><input type="text" data-sec="${i}" value="${esc(s)}"><button data-act="secup" data-i="${i}" aria-label="Subir">↑</button><button data-act="secdn" data-i="${i}" aria-label="Bajar">↓</button><button data-act="secdel" data-i="${i}" aria-label="Quitar" style="color:#b3261e">✕</button></div>`).join('')||'<p class="hint">Aún no tienes secciones.</p>'}
   <label>Nueva sección</label><div class="secrow" style="margin-top:0"><input type="text" id="newSec" placeholder="Ej. Girasoles naturales"><button data-act="secadd" style="width:auto;padding:0 14px;font-weight:600">Agregar</button></div>
   <div class="btns"><button class="btn primary" data-act="closesec">Listo</button></div>`);
  view={kind:'secs',id:null};
}

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  if(a==='ovl'){if(e.target!==el)return;closeModal();return}
  if(a==='inc'){setQty(id,1)}
  else if(a==='dec'){setQty(id,-1)}
  else if(a==='detail'){openDetail(id)}
  else if(a==='cart'){openCart()}
  else if(a==='close'){closeModal()}
  else if(a==='closeset'){closeModal();renderApp();}
  else if(a==='mode'){form.mode=el.dataset.v;persist();openCart(true)}
  else if(a==='wa'){
    if(!cartItems().length){e.preventDefault();return}
    if(!form.name.trim()){e.preventDefault();toast('Escribe tu nombre para continuar');const i=$('[data-f="name"]');if(i)i.focus();return}
    if(!waNum()){e.preventDefault();toast('El negocio aún no configuró su WhatsApp');return}
    el.href=waUrl();
  }
  else if(a==='admin'){if(!canAdmin)return;admin=true;renderApp();window.scrollTo({top:0})}
  else if(a==='exit'){admin=false;renderApp()}
  else if(a==='settings'){openSettings()}
  else if(a==='newp'){openEditor(null)}
  else if(a==='bulk'){openBulk()}
  else if(a==='sec'){curSec=el.dataset.v||'';renderMain();const c=$('#chips');if(c)window.scrollTo({top:Math.max(0,c.offsetTop-70),behavior:'smooth'})}
  else if(a==='secs'){openSections()}
  else if(a==='secup'||a==='secdn'){const i=+el.dataset.i,j=a==='secup'?i-1:i+1;if(j>=0&&j<state.sections.length){const t=state.sections[i];state.sections[i]=state.sections[j];state.sections[j]=t;markDirty();openSections()}}
  else if(a==='secdel'){const i=+el.dataset.i,nm=state.sections[i];state.products.forEach(p=>{if(p.cat===nm)p.cat=''});state.sections.splice(i,1);markDirty();openSections()}
  else if(a==='secadd'){const v=(($('#newSec')||{}).value||'').trim();if(v&&state.sections.indexOf(v)<0){state.sections.push(v);markDirty()}openSections()}
  else if(a==='closesec'){closeModal();curSec='';renderApp()}
  else if(a==='tpl'){bulkTemplate()}
  else if(a==='bulkprev'){bulkPreview()}
  else if(a==='bulkgo'){bulkGo()}
  else if(a==='edit'){openEditor(id)}
  else if(a==='del'){
    if(el.dataset.armed){state.products=state.products.filter(p=>p.id!==id);delete cart[id];persist();markDirty();renderApp()}
    else{el.dataset.armed='1';el.textContent='¿Seguro?';setTimeout(()=>{if(el.isConnected){delete el.dataset.armed;el.textContent='Eliminar'}},3000)}
  }
  else if(a==='mvl'||a==='mvr'){
    const i=state.products.findIndex(p=>p.id===id);let j=i;const cc=(state.products[i].cat||'');do{j+=a==='mvl'?-1:1}while(j>=0&&j<state.products.length&&(state.products[j].cat||'')!==cc);
    if(j>=0&&j<state.products.length){const t=state.products[i];state.products[i]=state.products[j];state.products[j]=t;markDirty();renderApp()}
  }
  else if(a==='saveitem'){
    const price=parseFloat(String(editing.price).replace(',','.'));
    if(!String(editing.name).trim()){toast('Ponle un nombre al ramo');return}
    if(isNaN(price)||price<0){toast('Escribe un precio válido');return}
    const nc=String(editing.newcat||'').trim();const catv=nc||editing.cat||'';
    const item={id:editing.id||uid(),cat:catv,name:String(editing.name).trim(),price:price,roses:(function(){const r=parseInt(editing.roses,10);return r>0?r:''})(),desc:String(editing.desc).trim(),img:editing.img||'',tone:editing.tone||0,avail:editing.avail!==false};
    if(editing.id){const i=state.products.findIndex(p=>p.id===editing.id);state.products[i]=item}else state.products.push(item);
    markDirty();closeModal();renderApp();
  }
  else if(a==='publish'){publish()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.f){form[t.dataset.f]=t.value;persist()}
  else if(t.dataset.e){editing[t.dataset.e]=t.type==='checkbox'?t.checked:t.value}
  else if(t.dataset.s){state[t.dataset.s]=t.value;markDirty()}
  else if(t.dataset.sec!==undefined){const i=+t.dataset.sec,v=t.value.trim(),old=state.sections[i];if(v&&v!==old){state.products.forEach(p=>{if(p.cat===old)p.cat=v});state.sections[i]=v;markDirty()}}
  else if(t.dataset.b){bulk[t.dataset.b]=t.value}
  else if(t.dataset.g){
    gh[t.dataset.g]=t.value.trim();
    let ok=true;try{localStorage.setItem('qd-gh',JSON.stringify(gh));ok=!!localStorage.getItem('qd-gh')}catch(e){ok=false}
    const st=$('#ghStatus');if(st)st.textContent=!gh.token?'Aún no hay token guardado':ok?'✓ Token guardado en este navegador':'⚠ Este navegador no permite guardar datos (¿ventana privada?)';
  }
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.classList&&t.classList.contains('bulkcsv')&&t.files&&t.files[0]){
    try{bulk.text=await readText(t.files[0]);const ta=$('#bulkText');if(ta)ta.value=bulk.text;toast('Archivo cargado. Toca Revisar')}catch(err){toast('No se pudo leer el archivo')}
    t.value='';return;
  }
  if(t.classList&&t.classList.contains('bulkph')&&t.files&&t.files.length){await bulkLoadPhotos(t.files);t.value='';return}
  if(t.classList&&t.classList.contains('imgin')&&t.files&&t.files[0]){
    try{toast('Cargando foto…');editing.img=await fileToDataUrl(t.files[0]);$('#dropin').innerHTML=imgOf(editing);toast('Foto lista ✓')}
    catch(err){toast('No se pudo leer la imagen. Prueba con otra foto')}
    t.value='';
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal .overlay'))closeModal()});

/* ---------- Inicio ---------- */
$('#overlay-root').innerHTML='<div id="bar"></div><div id="modal"></div><div id="toast" role="status" aria-live="polite"></div>';
renderApp();
if(location.hash==='#admin'){
  canAdmin=true;admin=true;
  try{const d=JSON.parse(localStorage.getItem('qd-draft')||'null');if(d&&d.products){state=d;dirty=true;}}catch(e){}
  renderApp();
}
})();
</script>


</body></html>
